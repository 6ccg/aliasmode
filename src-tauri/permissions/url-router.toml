[[permission]]
identifier = "allow-url-router"
description = "Allows browser routing settings in the main local dashboard."
commands.allow = ["installed_browsers", "browser_preferences", "save_routing_preferences", "browser_icons", "validate_browser_application", "default_browser_status", "request_default_browser"]

[[permission]]
identifier = "allow-browser-chooser"
description = "Allows link choice, browser discovery, icons and chooser preferences."
commands.allow = ["pending_browser_urls", "present_browser_chooser", "dismiss_browser_url", "installed_browsers", "browser_preferences", "save_routing_preferences", "browser_icons", "open_browser_url", "validate_browser_application"]
