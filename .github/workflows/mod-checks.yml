name: Mod checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:mod
      - name: Official unit tests (optional)
        if: vars.RUN_OFFICIAL_TESTS == 'true'
        run: bun test
