name: Publish mod preview

on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: Client CI run with the Windows candidate artifact
        required: true
        type: string
      macos_run:
        description: Apple Silicon preview build run
        required: true
        type: string
      notes:
        description: Release notes in Markdown
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      MACOS_RUN: ${{ inputs.macos_run }}
      NOTES: ${{ inputs.notes }}
    steps:
      - name: Verify both builds and publish the preview
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WINDOWS_RUN" =~ ^[0-9]+$ && "$MACOS_RUN" =~ ^[0-9]+$ ]]
          windows=$(gh run view "$WINDOWS_RUN" --json headSha,headBranch,status,workflowName)
          macos=$(gh run view "$MACOS_RUN" --json headSha,headBranch,status,conclusion,workflowName)
          source=$(jq -er '.headSha' <<< "$windows")
          [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          jq -e '.headBranch == "main" and .status == "completed" and .workflowName == "Client CI"' <<< "$windows" >/dev/null
          jq -e --arg source "$source" '.headSha == $source and .headBranch == "main" and .status == "completed" and .conclusion == "success" and .workflowName == "Build macOS ARM64 preview"' <<< "$macos" >/dev/null

          version=$(gh api "repos/$GH_REPO/contents/package.json?ref=$source" --jq .content | base64 -d | jq -er .version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.mod[1-9][0-9]*$ ]]
          tag="v$version"
          gh run download "$WINDOWS_RUN" --name aliasmode-windows-candidate --dir windows
          gh run download "$MACOS_RUN" --name aliasmode-macos-arm64 --dir macos

          verify() (
            cd "$1"
            local checksums=$2
            shift 2
            sed -i 's/\r$//' "$checksums"
            diff -u <(printf '%s\n' "$@" | sort) <(awk '{print $2}' "$checksums" | sort)
            sha256sum --check --strict "$checksums"
          )

          win_setup="AliasMode_${version}_x64-setup.exe"
          win_offline="AliasMode_${version}_x64-offline-setup.exe"
          mac_dmg="AliasMode_${version}_aarch64.dmg"
          mac_archive="AliasMode_${version}_aarch64.app.tar.gz"
          verify windows SHA256SUMS.txt "$win_setup" "$win_offline"
          verify macos SHA256SUMS-macos.txt "$mac_dmg" "$mac_archive"
          files=("windows/$win_setup" "windows/$win_offline" windows/SHA256SUMS.txt
                 "macos/$mac_dmg" "macos/$mac_archive" macos/SHA256SUMS-macos.txt)

          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "${files[@]}" --draft --prerelease --target "$source" \
            --title "AliasMode $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          release=$(gh api "repos/$GH_REPO/releases?per_page=100" | jq -ce --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft)')
          jq -e --arg source "$source" '.target_commitish == $source and (.assets | length) == 6' <<< "$release" >/dev/null
          for file in "${files[@]}"; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg name "${file##*/}" --arg digest "$digest" \
              '.assets | any(.name == $name and .state == "uploaded" and .digest == $digest)' <<< "$release" >/dev/null
          done
          gh release edit "$tag" --draft=false
